[project]
name = "quickhttp"
version = "2.2.0"
description = "Lightweight CLI that wraps Python's http.server with automatic port-finding and shutdown."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jay Qi", email = "jayqi.opensource@gmail.com" }]
keywords = ["http server", "dev server"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
requires-python = ">=3.11"
dependencies = [
  "pytimeparse>=1.1.8",
  "typer>=0.3.0",
]

[project.urls]
homepage = "https://github.com/jayqi/quickhttp"
repository = "https://github.com/jayqi/quickhttp"
changelog = "https://github.com/jayqi/quickhttp/blob/main/CHANGELOG.md"

[project.scripts]
quickhttp = "quickhttp.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

## DEV

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "vspect" },
]
lint = [
  "ruff>=0.0.245",
]
test = [
  "pytest>=7.2",
  "coverage>=7.1",
  "pytest-cov>=4.0",
  "pytest-rerunfailures",
  "requests",
]
typecheck = [
  "mypy[install-types]>=1.0.0",
]
vspect = [
  "vspect",
]

## TOOLS

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]
line-length = 99
src = ["src", "tests"]
exclude = ["tests/assets"]

[tool.ruff.lint]
select = [
  "E", # Pyflakes
  "F", # Pycodestyle
  "I", # isort
]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--cov=quickhttp --cov-report=term --cov-report=html --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["quickhttp"]

[tool.coverage.paths]
quickhttp = [
  "src/quickhttp/",
  "*/src/quickhttp/",
  "*/site-packages/quickhttp/",
]
